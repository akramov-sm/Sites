function Home({data,go}){const [slide,setSlide]=useState(0);const slides=data.hero.filter(x=>x.enabled);useEffect(()=>{if(slides.length<2)return;const t=setInterval(()=>setSlide(s=>(s+1)%slides.length),6500);return()=>clearInterval(t)},[slides.length]);const h=slides[slide%Math.max(1,slides.length)];return <><Header go={go}/><main id="top" className="pt-28"><div className="shell">{h?<section className="hero p-8 md:p-14 lg:p-20"><div className="hero-shine"/><div className="hero-copy relative z-10" style={{width:'62%'}}><div className="text-xs md:text-sm tracking-widest font-bold opacity-80 mb-6">{h.kicker}</div><h1 className="hero-title">{h.title}</h1><p className="mt-7 text-lg md:text-xl max-w-lg text-purple-100 leading-relaxed">{h.description}</p><A href={h.url} className="btn secondary mt-9">{h.button||'Подробнее'} <Icon name="arrow-up-right"/></A><div className="flex gap-2 mt-14">{slides.map((s,i)=><button key={s.id} onClick={()=>setSlide(i)} aria-label={'Слайд '+(i+1)} className={'h-1.5 rounded-full transition-all '+(i===slide?'w-10 bg-white':'w-5 bg-white/40')}/>)}</div></div><div className="hero-visual absolute z-0" style={{right:'1%',top:'27%',width:'43%'}}>{h.image?<img src={h.image} alt="Баннер акции" className="w-full rounded-2xl object-contain"/>:<><div className="orb absolute" style={{right:'20%',top:-40}}/><Car/><div className="prize" style={{top:-95,right:10}}><small>ГЛАВНЫЙ ПРИЗ</small><b>Zeekr 001</b></div><div className="prize" style={{bottom:-5,left:0}}><small>APPLE</small><b>iPhone 18 Pro Max</b></div><div className="prize" style={{bottom:-65,right:15}}><small>И ЕЩЁ</small><b>Watch · AirPods</b></div></>}</div></section>:<section className="panel p-12">Главный баннер отключён в административной панели.</section>}<div className="flex justify-between flex-wrap gap-3 py-6 text-xs muted"><span>Концептуальный редизайн · Неофициальный прототип</span><span>Информация о тарифах и акциях — ucell.uz</span></div></div>

{data.iphone.enabled&&<section className="shell py-12"><Reveal><div className="panel overflow-hidden grid md:grid-cols-2 items-center min-h-[500px]" style={{background:'linear-gradient(120deg,#f6f1ff,#fff 65%)'}}><div className="p-9 md:p-16"><div className="eyebrow mb-5">APPLE × UCELL</div><h2 className="heading">{data.iphone.title}</h2><p className="muted mt-6 text-lg max-w-md">{data.iphone.description}</p><A href={data.iphone.url} className="btn primary mt-8">Подробнее <Icon name="arrow-up-right" size={18}/></A></div><div className="flex justify-center items-center p-12 min-h-[420px]">{data.iphone.image?<img src={data.iphone.image} alt="Устройство Apple" className="max-h-96 object-contain"/>:<Phone/>}</div></div></Reveal></section>}

{data.settings.showPromos&&<section className="shell py-16" id="promos"><Reveal><SectionTitle kicker="АКТУАЛЬНО" title="Больше возможностей." description="Акции и специальные предложения Ucell."/></Reveal><div className="grid md:grid-cols-3 gap-5">{data.promos.filter(x=>x.enabled).map((p,i)=><Reveal key={p.id} style={{transitionDelay:i*90+'ms'}}><A href={p.url} className="panel lift overflow-hidden block h-full"><div className="h-52 relative overflow-hidden flex items-center justify-center" style={{background:i%2===0?'linear-gradient(130deg,#5313af,#aa75f1)':'linear-gradient(130deg,#e8ddfa,#b6a0e6)'}}>{p.image?<img src={p.image} alt={p.title} className="w-full h-full object-cover hover:scale-105 transition-transform"/>:<><div className="absolute w-40 h-40 rounded-full border-[28px] border-white/15 right-[-20px] top-[-25px]"/><span className={'font-black text-5xl tracking-tighter '+(i%2===0?'text-white':'text-purple-800')}>{i===0?'2027':i===1?'iPhone':'30'}</span></>}</div><div className="p-7"><div className="eyebrow mb-3">{p.date}</div><h3 className="text-xl font-extrabold">{p.title}</h3><p className="muted mt-3 text-sm">{p.description}</p><div className="link mt-6">Подробнее ↗</div></div></A></Reveal>)}</div></section>}
{data.settings.showApp&&<section className="shell py-20"><Reveal><div className="rounded-[34px] overflow-hidden bg-[#241137] text-white grid md:grid-cols-2 min-h-[480px]"><div className="p-10 md:p-16"><div className="eyebrow !text-purple-300 mb-5">UCELL APP</div><h2 className="subheading">Всё под контролем.<br/>В одном приложении.</h2><p className="text-purple-200 mt-6 text-lg">Проверяйте баланс, управляйте услугами и участвуйте в акциях Ucell.</p><A href={URLS.app} className="btn secondary mt-9">О приложении <Icon name="arrow-up-right"/></A></div><div className="flex items-end justify-center pt-12" style={{background:'radial-gradient(circle,#7c45c6,transparent 65%)'}}><AppPhone/></div></div></Reveal></section>}
{data.settings.showNews&&<section className="shell py-20" id="news"><Reveal><div className="flex justify-between items-end flex-wrap"><SectionTitle kicker="МЕДИАЦЕНТР" title="Новости Ucell."/><A href={URLS.news} className="link mb-10">Все новости ↗</A></div></Reveal><div className="border-t border-gray-200">{data.news.filter(x=>x.enabled).map(n=><A key={n.id} href={n.url} className="grid md:grid-cols-[150px_1fr_30px] items-center gap-4 py-7 border-b border-gray-200 group"><span className="muted text-sm">{n.date}</span><div><h3 className="font-bold text-lg group-hover:text-purple-700 transition-colors">{n.title}</h3><p className="muted text-sm mt-1">{n.description}</p></div><Icon name="arrow-up-right"/></A>)}</div></section>}
</main><footer id="support" className="bg-[#20152f] text-white mt-12"><div className="shell py-16"><div className="flex justify-between gap-8 flex-wrap mb-16"><div><div className="logo !text-white">ucell</div><p className="text-purple-200 mt-4 max-w-sm">Цифровые возможности для каждого.</p></div><div className="grid grid-cols-2 md:grid-cols-3 gap-10 text-sm">{[[['Тарифы',URLS.tariffs],['Услуги',URLS.internet],['Акции',URLS.campaign]],[['Интернет',URLS.internet],['Роуминг',URLS.roaming],['Поддержка',URLS.support]],[['О компании',URLS.app],['Адреса офисов',URLS.offices],['Новости',URLS.news]]].map((col,i)=><div key={i} className="flex flex-col gap-4">{col.map(([name,url])=><A key={name} href={url} className="hover:text-purple-300">{name}</A>)}</div>)}</div></div><div className="border-t border-white/15 pt-7 flex flex-wrap justify-between gap-4 text-xs text-purple-200"><span>© 2026 COSCOM · Концепт UX/UI, неофициальный прототип</span><div className="flex gap-6"><A href="https://ucell.uz/ru" className="hover:text-white">Официальный сайт</A><button onClick={()=>go('login')} className="hover:text-white">Admin <Icon name="lock-keyhole" size={12}/></button></div></div></div></footer></>}
function AdminLogin({go,onLogin}){const [user,setUser]=useState('demo'),[pass,setPass]=useState('demo2026'),[error,setError]=useState('');return <div className="min-h-screen flex items-center justify-center p-5" style={{background:'radial-gradient(circle at top right,#e3d1ff,#faf9fc 55%)'}}><div className="panel p-9 w-full max-w-md shadow-xl"><button className="text-sm muted flex gap-2 items-center mb-9" onClick={()=>go('home')}><Icon name="arrow-left" size={17}/> На сайт</button><div className="logo mb-8">ucell</div><h1 className="text-3xl font-extrabold tracking-tight">Admin Panel</h1><p className="muted mt-2">Демонстрационный вход в CMS</p><div className="bg-purple-50 rounded-xl p-4 text-sm mt-6 text-purple-900"><b>Демо-доступ</b><div>Логин: <code>demo</code></div><div>Пароль: <code>demo2026</code></div><div className="text-xs mt-2">Это локальная демонстрация, не защищённая авторизация.</div></div><form className="space-y-4 mt-7" onSubmit={e=>{e.preventDefault();if(user==='demo'&&pass==='demo2026'){onLogin()}else setError('Неверные демонстрационные данные')}}><label className="block text-sm font-bold">Логин<input className="field mt-2" value={user} onChange={e=>setUser(e.target.value)}/></label><label className="block text-sm font-bold">Пароль<input type="password" className="field mt-2" value={pass} onChange={e=>setPass(e.target.value)}/></label>{error&&<p className="text-red-600 text-sm">{error}</p>}<button className="btn primary w-full">Войти в Dashboard <Icon name="arrow-right" size={17}/></button></form></div></div>}
const fields={hero:[['kicker','Надзаголовок'],['title','Заголовок'],['description','Описание'],['button','Текст кнопки'],['url','Ссылка кнопки'],['image','Изображение']],promos:[['title','Заголовок'],['description','Описание'],['date','Дата'],['url','Ссылка'],['image','Изображение']],news:[['title','Заголовок'],['description','Описание'],['date','Дата публикации'],['url','Ссылка'],['image','Изображение']],tariffs:[['name','Название'],['gb','Интернет'],['minutes','Минуты'],['sms','SMS'],['price','Цена, сум'],['url','Ссылка']]};
function Field({label,value,onChange,image=false}){const file=useRef();return <label className="block text-sm"><span className="font-semibold block mb-2">{label}</span>{label==='Описание'?<textarea rows="3" className="field" value={value||''} onChange={e=>onChange(e.target.value)}/>:<input className="field" value={value||''} onChange={e=>onChange(e.target.value)} placeholder={image?'URL изображения или загрузите файл':''}/ >}{image&&<><input ref={file} type="file" accept="image/*" className="hidden" onChange={e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>900000){alert('Для localStorage выберите изображение меньше 900 КБ.');return}const r=new FileReader();r.onload=()=>onChange(r.result);r.readAsDataURL(f)}}/><button type="button" onClick={()=>file.current?.click()} className="mt-2 text-purple-700 text-xs font-bold flex items-center gap-2"><Icon name="upload" size={14}/> Загрузить изображение</button>{value&&<img src={value} alt="Предпросмотр" className="mt-2 max-h-32 rounded-xl" onError={e=>e.currentTarget.style.display='none'}/>}</>}</label>}
function Admin({data,setData,go,logout}){const [tab,setTab]=useState('overview'),[saved,setSaved]=useState(false);const update=(key,value)=>{setData(d=>({...d,[key]:value}));setSaved(false)};const updateItem=(key,id,field,value)=>update(key,data[key].map(x=>x.id===id?{...x,[field]:value}:x));const updateIphone=(field,value)=>update('iphone',{...data.iphone,[field]:value});const add=(key)=>{const base={id:Date.now(),enabled:true,url:'',image:''};fields[key].forEach(([f])=>base[f]='');update(key,[...data[key],base])};const save=()=>{try{localStorage.setItem('ucell-demo-content-v1',JSON.stringify(data));setSaved(true)}catch{alert('Не удалось сохранить: localStorage переполнен. Уменьшите размер загруженных изображений.')}};const sections=[['overview','layout-dashboard','Обзор'],['hero','images','Баннеры'],['promos','gift','Акции'],['iphone','smartphone','iPhone'],['tariffs','radio-tower','Тарифы'],['news','newspaper','Новости'],['settings','settings','Настройки']];return <div className="min-h-screen"><header className="glass border-b border-purple-100 sticky top-0 z-40"><div className="shell h-[76px] flex justify-between items-center gap-3"><div className="flex items-center gap-4"><div className="logo">ucell</div><span className="pill hide-mobile">CONTENT STUDIO</span></div><div className="flex items-center gap-2"><button className="btn outline !px-3 md:!px-5 text-sm" onClick={()=>go('home')}><Icon name="eye" size={16}/> <span className="hide-mobile">Предпросмотр</span></button><button className="btn primary !px-3 md:!px-5 text-sm" onClick={save}><Icon name="save" size={16}/> <span className="hide-mobile">Сохранить изменения</span></button><button className="text-sm ml-2" onClick={logout} title="Выйти"><Icon name="log-out"/></button></div></div></header><div className="flex"><aside className="admin-side p-3 md:p-5"><div className="text-purple-300 text-xs font-bold tracking-widest px-3 py-5 admin-label">УПРАВЛЕНИЕ</div>{sections.map(([id,icon,label])=><button key={id} className={'admin-tab flex items-center gap-3 mb-1 '+(tab===id?'active':'')} onClick={()=>setTab(id)} title={label}><Icon name={icon} size={19}/><span className="admin-label">{label}</span></button>)}</aside><div className="flex-1 min-w-0 p-4 md:p-10 max-w-6xl"><div className="flex justify-between items-start flex-wrap gap-3 mb-8"><div><div className="eyebrow mb-2">UCELL / ADMIN</div><h1 className="text-3xl md:text-4xl font-extrabold tracking-tight">{sections.find(x=>x[0]===tab)?.[2]}</h1><p className="muted mt-2 text-sm">Изменения видны в предпросмотре и сохраняются локально после нажатия «Сохранить».</p></div>{saved&&<span className="pill">✓ Сохранено в браузере</span>}</div>{tab==='overview'&&<><div className="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">{[['Баннеры',data.hero.length,'images'],['Акции',data.promos.length,'gift'],['Тарифы',data.tariffs.length,'radio-tower'],['Новости',data.news.length,'newspaper']].map(([l,n,i])=><div key={l} className="editor"><Icon name={i} size={24}/><div className="text-4xl font-black mt-7">{n}</div><div className="muted text-sm">{l}</div></div>)}</div><div className="editor mt-5"><h2 className="text-xl font-bold mb-3">Контент под вашим контролем</h2><p className="muted">Добавляйте и редактируйте блоки, загружайте изображения, скрывайте карточки и проверяйте результат. Контент сохраняется только в текущем браузере. Для публикации на реальном сайте потребуется серверная CMS и защищённая авторизация.</p></div></>}{['hero','promos','news','tariffs'].includes(tab)&&<><div className="flex justify-end mb-4"><button className="btn primary" onClick={()=>add(tab)}><Icon name="plus" size={17}/> Добавить {tab==='hero'?'слайд':tab==='promos'?'акцию':tab==='news'?'новость':'тариф'}</button></div><div className="space-y-5">{data[tab].map((item,i)=><div className="editor" key={item.id}><div className="flex justify-between items-center mb-5 gap-2"><h3 className="font-extrabold text-lg">{item.title||item.name||'Новая запись'} <span className="muted text-xs">#{i+1}</span></h3><div className="flex items-center gap-4"><label className="flex items-center gap-2 text-xs"><input type="checkbox" checked={!!item.enabled} onChange={e=>updateItem(tab,item.id,'enabled',e.target.checked)}/> Показывать</label><button className="text-red-600" onClick={()=>{if(confirm('Удалить запись?'))update(tab,data[tab].filter(x=>x.id!==item.id))}} title="Удалить"><Icon name="trash-2" size={18}/></button></div></div><div className="grid md:grid-cols-2 gap-4">{fields[tab].map(([field,label])=><Field key={field} label={label} value={item[field]} image={field==='image'} onChange={v=>updateItem(tab,item.id,field,v)}/>)}</div></div>)}</div></>}{tab==='iphone'&&<div className="editor"><label className="flex items-center gap-3 mb-6"><input type="checkbox" checked={!!data.iphone.enabled} onChange={e=>updateIphone('enabled',e.target.checked)}/> Показывать блок iPhone</label><div className="grid md:grid-cols-2 gap-4">{[['title','Заголовок'],['description','Описание'],['url','Ссылка'],['image','Изображение']].map(([f,l])=><Field key={f} label={l} value={data.iphone[f]} image={f==='image'} onChange={v=>updateIphone(f,v)}/>)}</div></div>}{tab==='settings'&&<div className="editor"><h2 className="text-xl font-bold mb-6">Видимость разделов</h2>{[['showServices','Услуги и связь'],['showPromos','Акции'],['showTariffs','Тарифы'],['showNews','Новости'],['showApp','Мобильное приложение']].map(([key,label])=><label key={key} className="flex items-center justify-between py-4 border-b border-gray-100"><span>{label}</span><input type="checkbox" checked={!!data.settings[key]} onChange={e=>update('settings',{...data.settings,[key]:e.target.checked})}/></label>)}<button className="btn outline mt-8 text-red-600" onClick={()=>{if(confirm('Восстановить исходные демонстрационные данные?')){setData(structuredClone(seed));setSaved(false)}}}><Icon name="rotate-ccw" size={16}/> Сбросить изменения</button></div>}</div></div></div>}
function App(){const[data,setData]=useState(load),[page,setPage]=useState(location.hash==='#admin'?'login':'home'),[authed,setAuthed]=useState(false);const go=p=>{setPage(p);location.hash=p==='login'?'admin':p==='dashboard'?'dashboard':'top';window.scrollTo({top:0,behavior:'instant'})};return page==='login'?<AdminLogin go={go} onLogin={()=>{setAuthed(true);go('dashboard')}}/>:page==='dashboard'&&authed?<Admin data={data} setData={setData} go={go} logout={()=>{setAuthed(false);go('login')}}/>:<Home data={data} go={go}/>};ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
